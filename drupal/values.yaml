# Can be switched to a hostPath mount when developing locally
applicationVolume:
  enabled: false
  path:

# This will add a sidecar container to the drupal deployment as well as inject environment variables into drupal's php-fpm container
blackfire:
  enabled: false
  server_id:
  server_token:
  client_id:
  client_token:
  resources:
    requests:
      cpu: 1m
      memory: 10M

db:
  database:
  host:
  pass:
  user:

env: dev

extraEnvs:

extraVolumes: []

extraVolumeMounts: []

fqdn:

imagePullSecrets:
  enabled: false
  secrets: []

ingress:
  annotations:
  hosts:
  service:
    name: varnish
    port: 80
  tls:
    enabled: false
    secretName: "tls-secret"
    custom:
      crt:
      key:

initContainer:
  enabled: true
  image:
  tag:

nginx:
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  configMapName: "default-nginx"
  extraAnnotations: {}
  image: "nginx:1.15-alpine"
  # Only used when autoscaling is disabled.
  replicaCount:
  resources:
    requests:
      cpu: 10m
      memory: 30Mi
  service:
    port: 80
    targetPort: 80
    targetName: "nginx"

php:
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  # Optional dedicated cron pod. When enabled, a separate Deployment (no HPA)
  # runs `drush cron` locally every `period` seconds, so heavy cron runs never
  # drive the serving php autoscaler. Reuses php.image + the init container.
  # Default-off: existing consumers keep using whatever cron they already have.
  cronWorker:
    enabled: false
    # Seconds slept between drush cron runs.
    period: 60
    replicaCount: 1
    drushPath: "/var/www/vendor/bin/drush"
    drupalRoot: "/var/www/docroot"
    # Optional --uri passed to drush (needed by cron tasks that build absolute
    # URLs, e.g. sitemap/feeds). Leave empty to omit.
    uri: ""
    extraAnnotations: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  configMapName: "default-php"
  session:
    useCustomCookie: false
    cookie:
      domain: ""
      secure: "0"
      path: "/"

  extraAnnotations:
  image: "favish/php-fpm:3.0.5"
  # Optional probes for the php-fpm container. Default off (empty) for backwards
  # compatibility. A readiness check on the FPM port gates rollout traffic so
  # nginx does not 502 from a pod whose code/opcache is not ready yet. Example:
  #   readinessProbe:
  #     tcpSocket: { port: 9000 }
  #     initialDelaySeconds: 5
  #     periodSeconds: 10
  #   livenessProbe:
  #     tcpSocket: { port: 9000 }
  #     initialDelaySeconds: 30
  #     periodSeconds: 30
  #     failureThreshold: 6
  livenessProbe: {}
  readinessProbe: {}
  metrics:
    image: "bakins/php-fpm-exporter"
    imageTag: "v0.4.1"
    resources:
      requests:
        memory: 10M
        cpu: 1m
  # Only used when autoscaling is disabled.
  replicaCount:
  resources:
    requests:
      cpu: 1
      memory: 1G
  service:
    port: 9000
    targetPort: 9000
    targetName: "php-fpm"

s3Filesystem:
  enabled: false
  accessKey:
  secretKey:
  bucket:
  region:
  hostname:

xdebug:
  enabled: false
  image: "favish/php-fpm-xdebug:3.0.5"
  # If you want to connect to xdebug when your chart is running outside of
  #  Docker for Mac, you'll need to add your IP address here.
  remoteHost: "host.docker.internal"
  resources:
    requests:
      memory: 10M
      cpu: 1m
  service:
    port: 9000
    targetPort: 9000
    targetName: "xdebug"
